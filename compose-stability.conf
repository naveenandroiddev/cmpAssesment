// Compose compiler stability configuration.
//
// :core:model is deliberately Compose-free (it is shared with the iOS framework and
// with pure-Kotlin tests), so the compiler cannot see a @Stable/@Immutable annotation
// on those classes. They ARE stable by construction: all-val data classes, value
// classes over Long, and kotlinx.collections.immutable collections.
//
// Listing them here restores skipping for every composable that takes them as a
// parameter. Without this file, a single unstable parameter forces a full-subtree
// recomposition on every one of the ~200 ticks/sec the feed produces.
com.dept.markets.core.model.*
com.dept.markets.core.domain.*

// Immutable collections are stable, the compiler just cannot prove it for the
// interface types.
kotlinx.collections.immutable.ImmutableList
kotlinx.collections.immutable.ImmutableMap
kotlinx.collections.immutable.ImmutableSet
kotlinx.collections.immutable.PersistentList
kotlinx.collections.immutable.PersistentMap
