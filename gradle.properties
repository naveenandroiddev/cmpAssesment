#====== Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

#====== Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M -Djdk.lang.Process.launchMechanism=posix_spawn
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true

#====== Kotlin/Native
# The K/N memory manager is the modern tracing GC. These knobs are documented in
# docs/adr/ADR-001-market-insights-architecture.md (memory management section).
kotlin.native.binary.gc=cms
kotlin.native.binary.gcSchedulerType=adaptive
kotlin.native.binary.objcDisposeOnMain=false

#====== Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#====== Compose
# Flip these on locally to emit stability/skippability reports per module:
# ./gradlew assembleDebug -PenableComposeCompilerReports=true
enableComposeCompilerReports=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
